<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Speech to Text - Memo Log</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            color: #333;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .subtitle {
            margin: 0 0 20px;
            color: #666;
            font-size: 14px;
        }

        .memo-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .memo-row {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 16px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 16px;
        }

        .audio-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filename {
            font-family: monospace;
            font-size: 13px;
            color: #495057;
            word-break: break-all;
        }

        .play-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: fit-content;
        }

        .play-button:hover {
            background: #0056b3;
        }

        .play-button.playing {
            background: #6c757d;
        }

        .transcription-input {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }

        .empty-state {
            background: white;
            border: 1px dashed #ced4da;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            color: #6c757d;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 16px;
        }

        .status-text {
            font-size: 14px;
            color: #495057;
        }

        .submit-button {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            min-width: 120px;
        }

        .submit-button:hover {
            background: #218838;
        }

        .submit-button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Memo Log</h1>
    <p class="subtitle">Review up to 10 memos at a time. Play each WAV, edit the transcription, then submit to save and remove the files.</p>

    <div id="memo-list" class="memo-list"></div>

    <div class="footer">
        <div id="status-text" class="status-text">Loading memos...</div>
        <button id="submit-button" class="submit-button" disabled>Submit</button>
    </div>

    <audio id="shared-audio"></audio>

    <script>
        const { ipcRenderer } = require('electron');

        const memoList = document.getElementById('memo-list');
        const statusText = document.getElementById('status-text');
        const submitButton = document.getElementById('submit-button');
        const sharedAudio = document.getElementById('shared-audio');

        let currentMemos = [];
        let totalRemaining = 0;
        let playingMemoId = null;

        function toFileUrl(filePath) {
            return 'file:///' + filePath.replace(/\\/g, '/');
        }

        function stopPlayback() {
            sharedAudio.pause();
            sharedAudio.currentTime = 0;
            playingMemoId = null;
            updatePlayButtons();
        }

        function updatePlayButtons() {
            document.querySelectorAll('.play-button').forEach((button) => {
                const isPlaying = button.dataset.memoId === playingMemoId;
                button.textContent = isPlaying ? 'Stop' : 'Play';
                button.classList.toggle('playing', isPlaying);
            });
        }

        async function handlePlayClick(event) {
            const button = event.currentTarget;
            const memoId = button.dataset.memoId;
            const wavPath = button.dataset.wavPath;

            if (playingMemoId === memoId) {
                stopPlayback();
                return;
            }

            stopPlayback();
            sharedAudio.src = toFileUrl(wavPath);
            playingMemoId = memoId;
            updatePlayButtons();

            try {
                await sharedAudio.play();
            } catch (error) {
                console.error('Failed to play audio:', error);
                stopPlayback();
            }
        }

        sharedAudio.addEventListener('ended', () => {
            stopPlayback();
        });

        async function persistMemoText(memoId, transcription) {
            try {
                await ipcRenderer.invoke('update-memo-text', memoId, transcription);
            } catch (error) {
                console.error('Failed to save memo text:', error);
            }
        }

        function renderMemos(pageData) {
            currentMemos = pageData.memos || [];
            totalRemaining = pageData.totalRemaining || 0;
            stopPlayback();
            memoList.innerHTML = '';

            if (currentMemos.length === 0) {
                memoList.innerHTML = '<div class="empty-state">No pending memos. New transcriptions will appear here for review.</div>';
                statusText.textContent = '0 pending memos';
                submitButton.disabled = true;
                return;
            }

            currentMemos.forEach((memo) => {
                const row = document.createElement('div');
                row.className = 'memo-row';

                const audioColumn = document.createElement('div');
                audioColumn.className = 'audio-column';

                const filename = document.createElement('div');
                filename.className = 'filename';
                filename.textContent = memo.filename;

                const playButton = document.createElement('button');
                playButton.className = 'play-button';
                playButton.type = 'button';
                playButton.textContent = 'Play';
                playButton.dataset.memoId = memo.id;
                playButton.dataset.wavPath = memo.wavPath;
                playButton.addEventListener('click', handlePlayClick);

                const textarea = document.createElement('textarea');
                textarea.className = 'transcription-input';
                textarea.value = memo.transcription || '';
                textarea.dataset.memoId = memo.id;
                textarea.addEventListener('blur', (event) => {
                    persistMemoText(memo.id, event.target.value);
                });

                audioColumn.appendChild(filename);
                audioColumn.appendChild(playButton);
                row.appendChild(audioColumn);
                row.appendChild(textarea);
                memoList.appendChild(row);
            });

            const showingCount = currentMemos.length;
            statusText.textContent = `Showing ${showingCount} of ${totalRemaining} pending memo${totalRemaining === 1 ? '' : 's'}`;
            submitButton.disabled = false;
        }

        async function loadMemoPage() {
            try {
                const pageData = await ipcRenderer.invoke('get-memo-page');
                renderMemos(pageData);
            } catch (error) {
                console.error('Failed to load memo page:', error);
                statusText.textContent = 'Failed to load memos';
                submitButton.disabled = true;
            }
        }

        async function submitCurrentPage() {
            if (currentMemos.length === 0) {
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';
            stopPlayback();

            const submissions = currentMemos.map((memo) => {
                const textarea = document.querySelector(`textarea[data-memo-id="${memo.id}"]`);
                return {
                    id: memo.id,
                    transcription: textarea ? textarea.value : memo.transcription
                };
            });

            try {
                const pageData = await ipcRenderer.invoke('submit-memo-page', submissions);
                renderMemos(pageData);
            } catch (error) {
                console.error('Failed to submit memos:', error);
                statusText.textContent = 'Failed to submit memos';
            } finally {
                submitButton.textContent = 'Submit';
                submitButton.disabled = currentMemos.length === 0;
            }
        }

        submitButton.addEventListener('click', submitCurrentPage);
        ipcRenderer.on('memos-updated', loadMemoPage);
        document.addEventListener('DOMContentLoaded', loadMemoPage);
    </script>
</body>
</html>
